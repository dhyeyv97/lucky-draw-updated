<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const params = new URLSearchParams(window.location.search);
const giftNo = params.get("gift");
const couponNo = params.get("coupon");

const screen = document.getElementById("screen");
let winnerData = null;

/* REVEAL WINNER IMMEDIATELY */
revealWinner();


const drum = document.getElementById("drum");

/* PLAY MUSIC IMMEDIATELY */
window.addEventListener("load", () => {
  drum.currentTime = 0;
  drum.play().catch(() => {
    console.log("Autoplay blocked by browser");
  });
});

async function revealWinner() {
  const res = await fetch("data.csv");
  const text = await res.text();
  const rows = text.replace(/\r/g, "").split("\n").slice(1);

  for (let row of rows) {
    if (!row.trim()) continue;

    const cols = row.split(",").map(c => c.trim());
    const coupon = String(cols[1]);
    const name = String(cols[4]);
if (giftNo) {
  document.getElementById("prizeNo").innerHTML = `ઇનામ નં: <b>${giftNo}</b>`;
}

    if (coupon === couponNo) {
      winnerData = {
        coupon,
        name,
        gift: gifts[giftNo].name
      };

      screen.innerHTML = `
        <div class="big"> 🎉 ${gifts[giftNo].name}🎉</div>
      
      
          <h2>${name}</h2>
        <div class="big">Coupon No. : <b>${coupon}</b></div>
        <div class="buttonbox">
          <button onclick="exportWinner()">Save / Export</button>
          <button onclick="goHome()" style="background:#6e3403;color:#fff">Go to Home</button>
        </div>
      `;
      return;
    }
  }

  screen.innerHTML = "<h2>❌ Coupon Not Found</h2>";
}

function goHome() {
  window.location.href = "index.html";
}

function exportWinner() {
  if (!winnerData) return;

  fetch("https://script.google.com/macros/s/AKfycbyA63bBqGmqcm1m9UvxlVvE9xYCHi6KcYJlejZJ6uGAFUtrfTCOTX22fAwkO6iltIDrgQ/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      giftNo,
      giftName: winnerData.gift,
      coupon: winnerData.coupon,
      name: winnerData.name
    })
  });

  Swal.fire({
                    title: "Winner saved to Google Sheet",
                    icon: "success",
                  });
}
</script>
