<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap');
  </style>
  <link rel="stylesheet" href="style.css">


</head>

<body>

  <div class="container">

    <div class="giftbox">
      <div>
        <img src="images/logo.png" class="logo mt-5">
      </div>
      <div class="d-flex">
        <img src="images/golden-offer.png" class="logo-offer">
        <h1 class="title-3d">2025/26 ડ્રો</h1>
      </div>

      <div class="input-box">
 <input type="number" id="giftNo" placeholder="Enter Gift Number (1–51)" min="1" max="51" inputmode="numeric"
        onkeydown="handleGiftEnter(event)">

      <input type="text" id="couponNo" placeholder="Enter Coupon Number" onkeydown="handleCouponEnter(event)">
      </div>
     

      <button onclick="go()">Reveal Winner</button>
    </div>


  </div>

 <script>
function go() {
  const giftInput = document.getElementById("giftNo");
  const couponInput = document.getElementById("couponNo");

  const gift = parseInt(giftInput.value, 10);
  const coupon = couponInput.value.trim();

  if (!gift || !coupon) {
    alert("Please enter both Gift Number and Coupon Number");
    return;
  }

  if (gift < 1 || gift > 51) {
    alert("Gift number must be between 1 and 51");
    giftInput.focus();
    return;
  }

  window.location.href = `reveal.html?gift=${gift}&coupon=${coupon}`;
}
</script>


  <script>
    function handleGiftEnter(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("couponNo").focus();
      }
    }

    function handleCouponEnter(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        go();
      }
    }
  </script>
  <script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>

</body>

</html>
